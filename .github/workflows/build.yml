name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Project build identity regression
        run: python3 tools/test_build_identity.py
      - name: Allocate immutable project build identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build_identity.py allocate --policy version-policy.json --output build/identity/build.json
      - name: Debug signing regression
        run: python3 audit/debug-signing-phase6/test_debug_signing.py
      - name: Signature output and toolchain compatibility regression
        run: python3 audit/signing-chain-phase7-turn509/test_signature_parser.py
      - name: Restore fixed development debug key
        env:
          GATEWAY_DEBUG_KEYSTORE_B64: ${{ secrets.GATEWAY_DEBUG_KEYSTORE_B64 }}
        run: python3 tools/debug_signing.py restore --target "$RUNNER_TEMP/gateway-debug.keystore"
      # NOTE: android-actions/setup-android 已移除 — 它尝试安装已被官方移除的 'tools' 包会失败；
      # ubuntu-latest runner 本身预装 Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk)。
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Env
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Reject source-embedded credentials
        run: python3 tools/check_secrets.py
      - name: Security regression tests (isolated loopback only)
        run: python3 audit/security-phase1/run_security.py --fetch-deps --output build/security-audit
      - name: Configuration transactions and limiter regression
        run: python3 audit/config-phase2/run_config.py --fetch-deps --output build/config-audit
      - name: Request lifecycle regression (isolated loopback only)
        run: python3 audit/lifecycle-phase3/run_lifecycle.py --fetch-deps --output build/lifecycle-audit
      - name: Model and routing semantics regression
        run: python3 audit/semantics-phase4/run_semantics.py --fetch-deps --output build/semantics-audit
      - name: Original 28 audit counterexamples (assertions unchanged)
        run: AUDIT_KOTLIN_LIB="$HOME/.cache/gateway-security-deps" python3 audit/semantics-phase4/regression/run_tests.py --output build/original-audit
      - name: Background MCP diagnostics regression
        run: python3 audit/mcp-debug-phase5/run_debug.py --fetch-deps --output build/mcp-debug-audit
      - name: Floating window source lifecycle contract (not device UI test)
        run: python3 audit/float-state-phase8-turn512/test_render_contract.py
      - name: Multi-upstream logical request colors regression
        run: python3 audit/float-state-phase8-turn512/run_visual.py --fetch-deps --output build/visual-state-audit
      - name: Shared workflows and editor task regression
        run: python3 audit/app-foundation-phase9-turn514/run_foundation.py --fetch-deps --output build/app-foundation-audit
      - name: Application entry and UI lifecycle source contract (not device UI test)
        run: python3 audit/app-foundation-phase9-turn514/test_app_contract.py
      - name: MCP export name regression (isolated preferences)
        run: python3 audit/mcp-name-turn561/run_name.py --fetch-deps --output build/mcp-name-audit
      - name: Assemble debug
        run: gradle :app:signingReport assembleDebug --no-daemon --stacktrace -PgatewayDebugKeystore="$RUNNER_TEMP/gateway-debug.keystore" -PgatewayBuildIdentity="$GITHUB_WORKSPACE/build/identity/build.json"
      - name: Verify fixed debug APK certificate
        run: python3 tools/debug_signing.py verify --apk app/build/outputs/apk/debug/app-debug.apk --sdk "$ANDROID_HOME" --build-tools-version 36.0.0 --output build/debug-signing-audit/results.json
      - name: Verify application Manifest and embedded build identity
        run: python3 tools/build_identity.py verify-apk --identity build/identity/build.json --apk app/build/outputs/apk/debug/app-debug.apk --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" --output build/identity/verified-apk.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            build/security-audit/**
            build/config-audit/**
            build/lifecycle-audit/**
            build/semantics-audit/**
            build/original-audit/**
            build/mcp-debug-audit/**
            build/debug-signing-audit/**
            build/visual-state-audit/**
            build/app-foundation-audit/**
            build/mcp-name-audit/**
            build/identity/**
          if-no-files-found: warn
